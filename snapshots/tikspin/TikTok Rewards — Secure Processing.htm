<!DOCTYPE html>

<body class="page-processing">

  <main class="processing">
    <!-- Brand -->
    <div class="processing__brand">
      <div class="processing__logo">
        <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true">
          <path fill="#fff" d="M33.5 8h-5.2v24.6c0 3.4-2.7 6.1-6.1 6.1s-6.1-2.7-6.1-6.1 2.7-6.1 6.1-6.1c.6 0 1.2.1 1.7.3v-5.3c-.6-.1-1.1-.1-1.7-.1-6.2 0-11.2 5-11.2 11.2s5 11.2 11.2 11.2 11.2-5 11.2-11.2V18.7c2 1.4 4.5 2.2 7.1 2.2v-5.2c-3.9 0-7-3.2-7-7.7z"></path>
        </svg>

    </div>

    <!-- Spinner -->
    <div class="spinner" aria-hidden="true">
      <svg class="spinner__ring" viewBox="0 0 80 80" width="120" height="120">
        <circle class="spinner__track" cx="40" cy="40" r="36" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"></circle>
        <circle class="spinner__arc" cx="40" cy="40" r="36" fill="none" stroke="#fe2c55" stroke-width="3" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="56"></circle>
      </svg>
      <div class="spinner__inner">$</div>
    </div>

    <!-- Progress list -->
    <ul class="progress-list">
      <li class="progress-item" data-step="1">
        <span class="progress-item__icon progress-item__icon--done"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
        <div class="progress-item__body">
          <div class="progress-item__title progress-item__title--muted">Verifying your payment method</div>
        </div>
        <span class="progress-item__bar progress-item__bar--done"></span>
      </li>

      <li class="progress-item" data-step="2">
        <span class="progress-item__icon progress-item__icon--done"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
        <div class="progress-item__body">
          <div class="progress-item__title progress-item__title--muted">Confirming withdrawal details</div>
          <div class="progress-item__sub" style="display: none;">Cross-checking records…</div>
        </div>
        <span class="progress-item__bar progress-item__bar--done"></span>
      </li>

      <li class="progress-item" data-step="3">
        <span class="progress-item__icon progress-item__icon--active"><svg class="spin-mini" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fe2c55" stroke-width="2.6" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></span>
        <div class="progress-item__body">
          <div class="progress-item__title">Releasing your $947.00 balance</div>
        </div>
        <span class="progress-item__bar progress-item__bar--active"></span>
      </li>

      <li class="progress-item" data-step="4">
        <span class="progress-item__icon progress-item__icon--todo">
          <span class="dot-todo"></span>
        </span>
        <div class="progress-item__body">
          <div class="progress-item__title progress-item__title--muted">Checking U.S. federal tax compliance</div>
        </div>
        <span class="progress-item__bar"></span>

    </ul>

    <!-- Total progress -->
    <div class="total-progress" aria-hidden="true">
      <div class="total-progress__bar"><span class="total-progress__fill" id="totalFill" style="width: 38%;"></span></div>
    </div>

    <p class="live-stat">
      <span class="live-stat__dot"></span>
      <strong>2,431</strong> USERS WITHDREW IN THE LAST HOUR
    </p>

    <div class="trust-row">
      <span class="trust-row__item">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"></path></svg>
        256-BIT SSL
      </span>
      <span class="trust-row__item">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        ENCRYPTED
      </span>
      <span class="trust-row__item">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        IRS VERIFIED
      </span>
    </div>
  </main>

<script>
  // Step progression
  const steps = document.querySelectorAll('.progress-item');
  const totalFill = document.getElementById('totalFill');

  // total 4 steps -> 25% each
  function setStepState(step, state) {
    const icon = step.querySelector('.progress-item__icon');
    const title = step.querySelector('.progress-item__title');
    const sub = step.querySelector('.progress-item__sub');
    const bar = step.querySelector('.progress-item__bar');

    icon.classList.remove('progress-item__icon--done','progress-item__icon--active','progress-item__icon--todo');
    bar.classList.remove('progress-item__bar--done','progress-item__bar--active');
    if (title) title.classList.remove('progress-item__title--muted');

    if (state === 'done') {
      icon.classList.add('progress-item__icon--done');
      icon.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      if (title) title.classList.add('progress-item__title--muted');
      bar.classList.add('progress-item__bar--done');
      if (sub) sub.style.display = 'none';
    } else if (state === 'active') {
      icon.classList.add('progress-item__icon--active');
      icon.innerHTML = '<svg class="spin-mini" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fe2c55" stroke-width="2.6" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
      bar.classList.add('progress-item__bar--active');
    }
  }
function appendUTMs(url) {
    const utmString = sessionStorage.getItem('funnel_utms');
    if (!utmString) return url;
    const separator = url.includes('?') ? '&' : '?';
    return url + separator + utmString;
  }
  
  function setTotal(pct) { totalFill.style.width = pct + '%'; }

 // Timeline
setTotal(12);
setStepState(steps[0], 'done');
setStepState(steps[1], 'active');
setTimeout(() => {
  setStepState(steps[1], 'done');
  setStepState(steps[2], 'active');
  setTotal(38);
}, 1400);
setTimeout(() => {
  setStepState(steps[2], 'done');
  setStepState(steps[3], 'active');
  setTotal(70);
}, 2800);
setTimeout(() => {
  setStepState(steps[3], 'done');
  setTotal(100);
}, 5200);
setTimeout(() => {
  window.location.href = appendUTMs('verify.html'); // ✅
}, 8400);
</script>
<script>
(function propagateUTMs() {
  const params = new URLSearchParams(window.location.search);
  const utmKeys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','xcod','sck'];

  let utmString = '';
  const hasUTMs = utmKeys.some(k => params.has(k));

  if (hasUTMs) {
    sessionStorage.setItem('funnel_utms', params.toString());
    utmString = params.toString();
  } else {
    utmString = sessionStorage.getItem('funnel_utms') || '';
  }

  if (!utmString) return;

  document.querySelectorAll('a[href]').forEach(link => {
    const href = link.getAttribute('href');
    if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto') || href.startsWith('tel')) return;

    const separator = href.includes('?') ? '&' : '?';
    link.setAttribute('href', href + separator + utmString);
  });
})();
</script>


</body></html>
